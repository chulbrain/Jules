<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신나는 단어 암기 쑥쑥!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>신나는 단어 암기 쑥쑥! 🚀</h1>
            <div class="user-stats">
                <p>🌟 포인트: <span id="points">0</span></p>
                <p>🔥 연속 정답: <span id="streak">0</span></p>
            </div>
        </header>

        <main>
            <section class="selection-area">
                <h2>학습할 단어 세트를 선택하세요! 👇</h2>
                <div class="set-selector">
                    <label for="set-type">종류:</label>
                    <select id="set-type">
                        <option value="day">Day별 학습</option>
                        <option value="unit">잉코북 Unit별 학습</option>
                    </select>
                    <label for="set-number">번호:</label>
                    <select id="set-number"></select>
                    <button id="start-button">학습 시작! 🎉</button>
                </div>
            </section>

            <section class="flashcard-area" style="display: none;">
                <div class="flashcard">
                    <div class="word-meaning">
                        <p id="meaning-text">[단어 뜻이 여기에 표시됩니다]</p>
                    </div>
                    <input type="text" id="spell-input" placeholder="스펠링을 입력하세요...">
                    <div class="buttons">
                        <button id="submit-answer-button">확인! ✅</button>
                        <button id="hint-button">힌트 💡</button>
                        <button id="show-answer-button">정답 보기 🧐</button>
                    </div>
                    <p id="feedback-text"></p>
                </div>
            </section>

            <section class="review-area" style="display: none;">
                <h2>틀린 단어 복습 🤓</h2>
                <div class="review-flashcard">
                    </div>
            </section>

            <section class="progress-area">
                <h2>학습 현황 📊</h2>
                <p>총 단어: <span id="total-words">0</span></p>
                <p>맞춘 단어: <span id="correct-words">0</span></p>
                <p>틀린 단어: <span id="incorrect-words">0</span></p>
                <div class="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
            </section>

            <section class="history-area" style="display: none;">
                <h2>학습 내역 📚</h2>
                <ul id="history-list"></ul>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 신나는 단어 암기 쑥쑥! All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
