<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Knowledge Graph Generator</h1>
        <form method="POST" class="mt-4">
            <div class="form-group">
                <label for="text">Enter text to generate a knowledge graph:</label>
                <textarea class="form-control" id="text" name="text" rows="10"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Generate</button>
        </form>

        {% if graph_file %}
        <div class="mt-5">
            <h2>Generated Knowledge Graph</h2>
            <iframe src="{{ url_for('static', filename=graph_file) }}" width="100%" height="800px"></iframe>
        </div>
        {% endif %}
    </div>
</body>
</html>
